services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: crew
      POSTGRES_USER: crew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U crew']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:8
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build: .
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready/',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    env_file: .env
    environment:
      DATABASE_URL: postgres://crew:${POSTGRES_PASSWORD}@db:5432/crew
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ['127.0.0.1:8000:8000']
    restart: unless-stopped
  worker:
    build: .
    command: [python, manage.py, run_game_worker]
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, python, scripts/check_worker_health.py]
      interval: 10s
      timeout: 3s
      retries: 3
    env_file: .env
    environment:
      DATABASE_URL: postgres://crew:${POSTGRES_PASSWORD}@db:5432/crew
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
