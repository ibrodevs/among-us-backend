name: Backend CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crew_test
          POSTGRES_USER: crew
          POSTGRES_PASSWORD: crew_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crew -d crew_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: github-actions-ci-key-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://crew:crew_ci_only@127.0.0.1:5432/crew_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test
