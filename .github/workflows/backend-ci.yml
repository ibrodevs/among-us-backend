name: Backend CI
on:
  pull_request:
    branches: [main, 'ai/**']
  push:
    branches: [main, 'ai/**']
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crew_test
          POSTGRES_USER: crew
          POSTGRES_PASSWORD: crew_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crew -d crew_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports: ['6379:6379']
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: github-actions-ci-key-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://crew:crew_ci_only@127.0.0.1:5432/crew_test
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Django system check
        run: python manage.py check
      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test
      - name: Verify idle Redis channel stays connected
        run: python scripts/check_idle_transport.py
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional smoke client
        run: python -m pip install 'websockets>=15,<17'
      - name: Configure disposable Compose environment
        run: |
          cat > .env <<'ENV'
          DJANGO_DEBUG=true
          DJANGO_SECRET_KEY=ci-compose-only-never-use-in-production
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          POSTGRES_PASSWORD=ci_compose_only
          ENV
      - name: Build and launch real containers
        run: |
          docker compose -p crew-ci build api worker
          docker compose -p crew-ci up -d db redis
          docker compose -p crew-ci run --rm api python manage.py migrate --noinput
          docker compose -p crew-ci up -d api worker
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ -o /dev/null; then break; fi
            sleep 1
          done
      - name: Verify HTTP WebSocket and separate game clock
        run: python scripts/smoke_stack.py
      - name: Container logs
        if: always()
        run: docker compose -p crew-ci logs --no-color api worker
      - name: Clean up disposable containers
        if: always()
        run: docker compose -p crew-ci down --volumes
